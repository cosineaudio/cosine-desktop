[package]
name = "cosine-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "cosine's web player in a lightweight Linux desktop client"
repository = "https://github.com/cosineaudio/cosine-desktop"
homepage = "https://github.com/cosineaudio/cosine-desktop"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
souvlaki = "0.9.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
